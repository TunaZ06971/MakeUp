name: MakeUp

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MakeUpCore:
    path: Packages/MakeUpCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Explicit values are required for supportedDestinations targets; otherwise
    # XcodeGen omits deploymentTarget and Xcode falls back to the installed SDK.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal signing belongs in ignored project.local.yml; see the example.
    CODE_SIGN_STYLE: Automatic

targets:
  MakeUp:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: MakeUpApp
    dependencies:
      - package: MakeUpCore
        product: MakeUpCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.makeup
        PRODUCT_NAME: MakeUp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Use the camera to capture your face shape and expressions on this device."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": "YES"
        # App Sandbox is macOS-only, so the entitlements are scoped to that SDK.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MakeUpApp/MakeUp.entitlements
    scheme:
      testTargets:
        - MakeUpTests

  MakeUpTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Tests
    dependencies:
      # Hosted by the app: a host-less xctest bundle has no app identity, so
      # Firebase Auth cannot write its session to the keychain (SecItemAdd
      # -34018). MakeUpCore is loaded from the host rather than linked again —
      # linking Firestore's C++ dependencies twice breaks the link step.
      - target: MakeUp
      - package: MakeUpCore
        product: MakeUpCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.makeup.tests
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/MakeUp.app/Contents/MacOS/MakeUp"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/MakeUp.app/MakeUp"
        GENERATE_INFOPLIST_FILE: "YES"
