name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Check public files and Git history
        run: |
          python3 scripts/security/audit_public.py --history
          python3 -m unittest discover -s scripts/security -p 'test_*.py'
          python3 -m unittest discover -s scripts/model-eval -p 'test_*.py'
      - name: Scan secrets with verified Gitleaks binary
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all' --redact=100 --no-banner
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm audit --audit-level=high
      - run: npm --prefix web audit --audit-level=moderate
      - run: npm run check:materials
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
      - name: Pure capture and archive regression checks
        working-directory: web
        run: npx playwright test head-capture.spec.ts --grep 'coverage uses|portable package|misleading stored-entry'
      - name: Ensure no development photos in the build
        run: test ! -e web/dist/dev
